<body>
<div class="shell">

    <nav aria-label="项目">

  <main>
    <section class="lead"><div class="eyebrow">03 / 机械臂情绪表达 · SO-101</div><h1>机械臂情绪表达</h1>
      <p>我觉得苹果的 <a href="https://machinelearning.apple.com/research/elegnt-expressive-functional-movement">ELEGNT 台灯机器人</a>很可爱，家里刚好有一台 SO-101，也想试着做一个。于是做了这个用动作表达情绪的小玩具，只是为了好玩，也希望给其他机械臂玩家添一点乐趣。</p>
      <div class="links"><a href="https://github.com/Muurrphy/expressive-arm">动作数据与开源工具</a><a href="../portfolio/">完整作品集</a></div>
    </section>
    <div class="player"><video id="video" controls playsinline preload="metadata"></video></div>
    <p id="status" class="status">视频暂时无法载入。<a id="download" href="#">直接打开视频文件</a></p>
    <div class="meta"><span id="name"></span><span id="duration"></span></div>
    <div class="clips"><button class="clip" data-id="sleepy" aria-pressed="false" aria-label="观看困倦"><img src="media/sleepy.jpg" alt="困倦动作实拍" loading="lazy"><span class="label">困倦<small>31.5s</small></span></button><button class="clip" data-id="disappointed" aria-pressed="false" aria-label="观看失落"><img src="media/disappointed.jpg" alt="失落动作实拍" loading="lazy"><span class="label">失落<small>14.0s</small></span></button><button class="clip" data-id="hesitant" aria-pressed="false" aria-label="观看犹豫"><img src="media/hesitant.jpg" alt="犹豫动作实拍" loading="lazy"><span class="label">犹豫<small>23.6s</small></span></button><button class="clip" data-id="happy" aria-pressed="false" aria-label="观看开心"><img src="media/happy.jpg" alt="开心动作实拍" loading="lazy"><span class="label">开心<small>17.8s</small></span></button><button class="clip" data-id="startled" aria-pressed="false" aria-label="观看震惊"><img src="media/startled.jpg" alt="震惊动作实拍" loading="lazy"><span class="label">震惊<small>13.5s</small></span></button><button class="clip" data-id="curious" aria-pressed="false" aria-label="观看好奇"><img src="media/curious.jpg" alt="好奇动作实拍" loading="lazy"><span class="label">好奇<small>19.7s</small></span></button><button class="clip" data-id="playful" aria-pressed="false" aria-label="观看玩耍"><img src="media/playful.jpg" alt="玩耍动作实拍" loading="lazy"><span class="label">玩耍<small>39.7s</small></span></button><button class="clip" data-id="angry" aria-pressed="false" aria-label="观看生气"><img src="media/angry.jpg" alt="生气动作实拍" loading="lazy"><span class="label">生气<small>25.9s</small></span></button></div>
  </main>
  <footer class="site-footer"><span>刘美辰 · Murphy Liu</span><span><a href="https://github.com/Muurrphy">GitHub ↗</a></span></footer>
</div>
<script>
const clips=[{"id": "sleepy", "name": "困倦", "duration": 31.5, "src": "media/sleepy.mp4", "poster": "media/sleepy.jpg"}, {"id": "disappointed", "name": "失落", "duration": 14.0, "src": "media/disappointed.mp4", "poster": "media/disappointed.jpg"}, {"id": "hesitant", "name": "犹豫", "duration": 23.566666666666666, "src": "media/hesitant.mp4", "poster": "media/hesitant.jpg"}, {"id": "happy", "name": "开心", "duration": 17.8, "src": "media/happy.mp4", "poster": "media/happy.jpg"}, {"id": "startled", "name": "震惊", "duration": 13.5, "src": "media/startled.mp4", "poster": "media/startled.jpg"}, {"id": "curious", "name": "好奇", "duration": 19.7, "src": "media/curious.mp4", "poster": "media/curious.jpg"}, {"id": "playful", "name": "玩耍", "duration": 39.733333333333334, "src": "media/playful.mp4", "poster": "media/playful.jpg"}, {"id": "angry", "name": "生气", "duration": 25.933333333333334, "src": "media/angry.mp4", "poster": "media/angry.jpg"}];
const video=document.getElementById('video');const buttons=[...document.querySelectorAll('.clip')];const status=document.getElementById('status');
function select(id,update=true){const c=clips.find(c=>c.id===id)||clips[0];video.pause();video.poster=c.poster;video.src=c.src;
document.getElementById('name').textContent=c.name;document.getElementById('duration').textContent=c.duration.toFixed(1)+' 秒';
document.getElementById('download').href=c.src;status.classList.remove('visible');
buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));
if(update){const url=new URL(location.href);url.searchParams.set('emotion',c.id);history.replaceState(null,'',url);video.play().catch(()=>{});}}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
video.addEventListener('error',()=>status.classList.add('visible'));
select(new URLSearchParams(location.search).get('emotion'),false);
</script>
</body>
</html>
