<section class="lead"><div class="eyebrow">02 / SO-101 · POWERED BY JEV</div><h1>Bipu</h1><p>通过 Telegram 给 Bipu 发消息，由 Jev 选择动作与电子叫声。使用 SO-101 机械臂。</p><div class="links"><a href="https://github.com/Muurrphy/bipu">开源代码与动作库 ↗</a><a href="../portfolio/#arm">完整作品集 ↗</a></div></section>

<h2 style="margin-top:3rem">八种动作表达</h2><div class="clips"><button class="clip" data-id="sleepy" aria-pressed="false"><img src="media/sleepy.jpg" alt="困倦动作实拍" loading="lazy"><span class="label">困倦<small>31.5s</small></span></button><button class="clip" data-id="disappointed" aria-pressed="false"><img src="media/disappointed.jpg" alt="失落动作实拍" loading="lazy"><span class="label">失落<small>14.0s</small></span></button><button class="clip" data-id="hesitant" aria-pressed="false"><img src="media/hesitant.jpg" alt="犹豫动作实拍" loading="lazy"><span class="label">犹豫<small>23.6s</small></span></button><button class="clip" data-id="happy" aria-pressed="false"><img src="media/happy.jpg" alt="开心动作实拍" loading="lazy"><span class="label">开心<small>17.8s</small></span></button><button class="clip" data-id="startled" aria-pressed="false"><img src="media/startled.jpg" alt="震惊动作实拍" loading="lazy"><span class="label">震惊<small>13.5s</small></span></button><button class="clip" data-id="curious" aria-pressed="false"><img src="media/curious.jpg" alt="好奇动作实拍" loading="lazy"><span class="label">好奇<small>19.7s</small></span></button><button class="clip" data-id="playful" aria-pressed="false"><img src="media/playful.jpg" alt="玩耍动作实拍" loading="lazy"><span class="label">玩耍<small>39.7s</small></span></button><button class="clip" data-id="angry" aria-pressed="false"><img src="media/angry.jpg" alt="生气动作实拍" loading="lazy"><span class="label">生气<small>25.9s</small></span></button></div></main><footer class="site-footer"><span>刘美辰 · Murphy Liu</span><a href="https://github.com/Muurrphy/bipu">Bipu on GitHub ↗</a></footer></div><script>
const modes=[{id:'pet',name:'Bipu · 宠物模式',duration:64.8,src:'bipu-pet-demo-20261009.mp4',poster:'bipu-pet-demo.jpg',caption:'Telegram 接收消息，Jev 根据预设规则和近期互动选择回应，Bipu 执行动作并播放对应声音。'},{id:'choreography',name:'章鱼场景 · 编排模式',duration:40.1,src:'arm-emotion-demo-20261008.mp4',poster:'arm-emotion-demo-20261009.jpg',caption:'Bipu 与人头机器人一起看屏幕上的章鱼。章鱼出现时，Bipu 后撤，人头再转过去看它。<br><small>屏幕中的章鱼视频：OIST，CC BY 4.0。</small>'}];
const clips=[{"id": "sleepy", "name": "困倦", "duration": 31.5, "src": "media/sleepy.mp4", "poster": "media/sleepy.jpg"}, {"id": "disappointed", "name": "失落", "duration": 14.0, "src": "media/disappointed.mp4", "poster": "media/disappointed.jpg"}, {"id": "hesitant", "name": "犹豫", "duration": 23.566666666666666, "src": "media/hesitant.mp4", "poster": "media/hesitant.jpg"}, {"id": "happy", "name": "开心", "duration": 17.8, "src": "media/happy.mp4", "poster": "media/happy.jpg"}, {"id": "startled", "name": "震惊", "duration": 13.5, "src": "media/startled.mp4", "poster": "media/startled.jpg"}, {"id": "curious", "name": "好奇", "duration": 19.7, "src": "media/curious.mp4", "poster": "media/curious.jpg"}, {"id": "playful", "name": "玩耍", "duration": 39.733333333333334, "src": "media/playful.mp4", "poster": "media/playful.jpg"}, {"id": "angry", "name": "生气", "duration": 25.933333333333334, "src": "media/angry.mp4", "poster": "media/angry.jpg"}];
const video=document.getElementById('video'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('button[data-id]')];
function requested(){const p=new URLSearchParams(location.search);return p.get('emotion')==='demo'?'choreography':p.get('emotion')||p.get('mode')||'pet'}
function select(id,update=false){const c=[...modes,...clips].find(x=>x.id===id)||modes[0];video.pause();video.poster=c.poster;video.src=c.src;document.getElementById('name').textContent=c.name;document.getElementById('duration').textContent=c.duration.toFixed(1)+' 秒';document.getElementById('download').href=c.src;document.getElementById('scene-credit').innerHTML=c.caption||'SO-101 动作实拍。动作轨迹收录在 Bipu 开源仓库中。';status.classList.remove('visible');buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));if(update){const u=new URL(location.href);u.searchParams.delete('emotion');u.searchParams.delete('mode');u.searchParams.set(modes.includes(c)?'mode':'emotion',c.id);history.pushState(null,'',u)}}
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.id,true)));video.addEventListener('error',()=>status.classList.add('visible'));window.addEventListener('popstate',()=>select(requested()));select(requested());
</script></body></html>
