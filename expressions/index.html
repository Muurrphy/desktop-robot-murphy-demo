<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>机械臂的八种表达 · Murphy</title><link rel="icon" href="../favicon.svg"><style>
:root{--paper:#f3f0ea;--ink:#181818;--muted:#756f66;--red:#d71932;--line:#d5d0c6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}a{color:inherit;text-underline-offset:5px}a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:5px}main{max-width:1220px;margin:auto;padding:32px 36px 44px}nav{display:flex;gap:22px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--line);font-size:13px}nav a[aria-current]{color:var(--red)}header{padding:46px 0 30px;display:flex;justify-content:space-between;gap:40px;align-items:end}h1{font-family:"Songti SC",serif;font-size:clamp(32px,4.4vw,52px);font-weight:500;line-height:1.25;margin:10px 0 0}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}header p{max-width:410px;font-size:14px;line-height:1.8;margin:0;color:var(--muted)}.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:30px}.player{background:#0c0d0e;min-width:0}video{display:block;width:100%;max-height:69vh;aspect-ratio:1;object-fit:contain;background:#0c0d0e}.caption{padding:18px 20px;color:#f3f0ea;display:flex;justify-content:space-between;gap:20px}.caption h2{font-size:19px;font-weight:500;margin:0}.caption span{font:11px ui-monospace,monospace;color:#bbb4ac}.clips{display:grid;grid-template-columns:1fr 1fr;gap:12px}.clip{padding:0;border:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;color:inherit;font:inherit}.clip[aria-pressed=true]{border:2px solid var(--red)}.clip img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.clip .label{display:flex;justify-content:space-between;align-items:center;padding:10px 9px;gap:5px;font-size:14px}.clip small{font:10px ui-monospace,monospace;color:var(--muted)}.help{padding:18px 0 0;margin:0;color:var(--muted);font-size:12px;line-height:1.7}.status{color:var(--red);font-size:13px;line-height:1.7;margin-top:14px}.status[hidden]{display:none}footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:12px;line-height:1.8}.experiment{padding-top:38px;margin-top:32px;border-top:1px solid var(--line);scroll-margin-top:20px;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:36px}.experiment video{aspect-ratio:16/9;max-height:none}.experiment h2{font-family:"Songti SC",serif;font-size:28px;font-weight:500;margin:10px 0 20px}.experiment p{font-size:14px;line-height:1.9;color:var(--muted)}@media(max-width:900px){.stage{grid-template-columns:1fr}.clips{grid-template-columns:repeat(4,1fr)}header{display:block}header p{margin-top:20px}.experiment{grid-template-columns:1fr}}@media(max-width:560px){main{padding:24px 18px}nav{gap:13px;font-size:12px}header{padding-top:34px}.clips{grid-template-columns:repeat(2,1fr)}video{max-height:none}.caption{padding:15px}.caption span{white-space:nowrap}.experiment{gap:14px}}
</style></head><body><main><nav><a href="../portfolio/">作品集</a><a href="../?project=desk">桌面机器人</a><a href="../?project=ground">地面机器人</a><a href="../expressions/" aria-current="page">八种表达</a></nav><header><div><div class="eyebrow">SO-101 / 2026</div><h1>机械臂情绪表达</h1></div><p>灵感来自 <a href="https://machinelearning.apple.com/research/elegnt-expressive-functional-movement">Apple ELEGNT</a> 台灯机器人研究（2025），用 SO-101 机械臂呈现八种动作表达。</p></header>
<div class="stage"><div class="player"><video id="video" controls playsinline preload="metadata"></video><div class="caption"><div><h2 id="name"></h2></div><span id="duration"></span></div></div><div><div class="clips"><button class="clip" data-id="sleepy" aria-pressed="false" aria-label="观看困倦"><img src="media/sleepy.jpg" alt="困倦动作实拍" loading="lazy"><span class="label">困倦<small>31.5s</small></span></button><button class="clip" data-id="disappointed" aria-pressed="false" aria-label="观看失落"><img src="media/disappointed.jpg" alt="失落动作实拍" loading="lazy"><span class="label">失落<small>14.0s</small></span></button><button class="clip" data-id="hesitant" aria-pressed="false" aria-label="观看犹豫"><img src="media/hesitant.jpg" alt="犹豫动作实拍" loading="lazy"><span class="label">犹豫<small>23.6s</small></span></button><button class="clip" data-id="happy" aria-pressed="false" aria-label="观看开心"><img src="media/happy.jpg" alt="开心动作实拍" loading="lazy"><span class="label">开心<small>17.8s</small></span></button><button class="clip" data-id="startled" aria-pressed="false" aria-label="观看震惊"><img src="media/startled.jpg" alt="震惊动作实拍" loading="lazy"><span class="label">震惊<small>13.5s</small></span></button><button class="clip" data-id="curious" aria-pressed="false" aria-label="观看好奇"><img src="media/curious.jpg" alt="好奇动作实拍" loading="lazy"><span class="label">好奇<small>19.7s</small></span></button><button class="clip" data-id="playful" aria-pressed="false" aria-label="观看玩耍"><img src="media/playful.jpg" alt="玩耍动作实拍" loading="lazy"><span class="label">玩耍<small>39.7s</small></span></button><button class="clip" data-id="angry" aria-pressed="false" aria-label="观看生气"><img src="media/angry.jpg" alt="生气动作实拍" loading="lazy"><span class="label">生气<small>25.9s</small></span></button></div><p class="help">选择动作后点击播放。</p></div></div><p id="status" class="status" role="status" hidden>视频暂时无法载入。<a id="download" href="#">直接打开视频文件</a></p>
<footer><span>刘美辰 / Murphy</span><span><a href="https://github.com/Muurrphy/expressive-arm">动作数据与开源工具 ↗</a><br><a href="../portfolio/">查看完整作品集 ↗</a></span></footer>
<script>const clips=[{"id": "sleepy", "name": "困倦", "duration": 31.5, "src": "media/sleepy.mp4", "poster": "media/sleepy.jpg"}, {"id": "disappointed", "name": "失落", "duration": 14.0, "src": "media/disappointed.mp4", "poster": "media/disappointed.jpg"}, {"id": "hesitant", "name": "犹豫", "duration": 23.566666666666666, "src": "media/hesitant.mp4", "poster": "media/hesitant.jpg"}, {"id": "happy", "name": "开心", "duration": 17.8, "src": "media/happy.mp4", "poster": "media/happy.jpg"}, {"id": "startled", "name": "震惊", "duration": 13.5, "src": "media/startled.mp4", "poster": "media/startled.jpg"}, {"id": "curious", "name": "好奇", "duration": 19.7, "src": "media/curious.mp4", "poster": "media/curious.jpg"}, {"id": "playful", "name": "玩耍", "duration": 39.733333333333334, "src": "media/playful.mp4", "poster": "media/playful.jpg"}, {"id": "angry", "name": "生气", "duration": 25.933333333333334, "src": "media/angry.mp4", "poster": "media/angry.jpg"}];const video=document.getElementById('video');const buttons=[...document.querySelectorAll('.clip')];function select(id,update=true){const c=clips.find(c=>c.id===id)||clips[0];video.pause();video.poster=c.poster;video.src=c.src;document.getElementById('name').textContent=c.name;document.getElementById('duration').textContent=c.duration.toFixed(1)+' SEC';document.getElementById('download').href=c.src;document.getElementById('status').hidden=true;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));if(update){const url=new URL(location.href);url.searchParams.set('emotion',c.id);history.replaceState(null,'',url)}}buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));video.addEventListener('error',()=>document.getElementById('status').hidden=false);window.addEventListener('popstate',()=>select(new URLSearchParams(location.search).get('emotion'),false));select(new URLSearchParams(location.search).get('emotion'),false);</script></main></body></html>
