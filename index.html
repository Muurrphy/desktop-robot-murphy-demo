<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>作品与视频 · Murphy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css?v=20261008">
</head>
<body>
<div class="shell">
  <header class="site-header">
    <a class="wordmark" href="./">Murphy<i>.</i></a>
    <nav aria-label="项目">
      <a href="portfolio/">作品集</a>
      <a href="?project=desk" data-p="desk">桌面机器人</a>
      <a href="?project=ground" data-p="ground">地面机器人</a>
      <a href="expressions/">机械臂情绪</a>
      <a href="?project=margin" data-p="margin">Kindle 伴读</a>
    </nav>
  </header>
  <main id="main"></main>
  <footer class="site-footer"><span>刘美辰 · Murphy Liu</span><span><a href="https://github.com/Muurrphy">GitHub ↗</a></span></footer>
</div>
<script src="hls.min.js"></script>
<script>
const P={
  desk:{n:'01',name:'桌面人形机器人',poster:'desk.jpg',href:'?project=desk',
    intro:'接入实时语音的桌面机器人原型：小屏上的眼睛和嘴，加上会转动的头。',meta:'中文实拍 · 5 分 13 秒',dur:'5 分 13 秒',hls:true,
    cap:'这是我做的桌面机器人原型，已经能和人对话。视频把它放进了个人助手的使用场景，要让它在日常生活中长期可靠地帮人处理事情，还需要继续开发。'},
  ground:{n:'02',name:'热成像追踪与激光避障机器人',poster:'ground.jpg',href:'?project=ground',src:'ground.mp4',
    intro:'用热成像找人，用激光测距保持距离、避开障碍。',meta:'实拍 · 47 秒',dur:'47 秒'},
  arm:{n:'03',name:'机械臂情绪系统',poster:'expressions/arm-emotion-demo.jpg',href:'expressions/',
    intro:'受苹果 ELEGNT 台灯机器人启发，用动作表达情绪的 SO-101 小玩具。',meta:'场景演示 · 40 秒',dur:'40 秒'},
  margin:{n:'04',name:'Kindle 伴读与多语言口型',href:'?project=margin',placeholder:true,
    intro:'',link:['https://github.com/Muurrphy/margin','开源代码'],meta:'',dur:''}
};
const main=document.getElementById('main');
const key=new URLSearchParams(location.search).get('project');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(k){const p=P[k];if(p.placeholder)return `<a class="card" href="${p.href}"><div class="ph reserved"><span>演示视频预留位</span></div><span class="num">${p.n} / ${esc(p.name)}</span><h2>${esc(p.name)}</h2></a>`;return `<a class="card" href="${p.href}"><div class="ph"><img src="${p.poster}" alt="${esc(p.name)}视频封面" loading="lazy"></div><span class="num">${p.n} / ${esc(p.name)}</span><h2>${esc(p.name)}</h2><p>${esc(p.intro)}</p><span class="go">观看视频 · ${p.dur} →</span></a>`}
if(!P[key]||key==='arm'){
  document.title='作品与视频 · Murphy';
  main.innerHTML=`<section class="lead"><div class="eyebrow">刘美辰 · 机器人原型与演示视频</div><h1>作品与视频</h1><p>项目的实拍与场景演示。完整介绍在作品集里。</p><div class="links"><a href="portfolio/">在线阅读作品集</a><a href="https://github.com/Muurrphy">GitHub</a></div></section><section class="cards">${['desk','ground','arm','margin'].map(card).join('')}</section>`;
}else if(P[key].placeholder){
  document.title=P[key].name+' · Murphy';
  document.querySelector(`nav a[data-p="${key}"]`)?.setAttribute('aria-current','page');
  main.innerHTML=`<section class="lead"><div class="eyebrow">04 / Margin</div><h1>${esc(P[key].name)}</h1></section><div class="video-placeholder" aria-label="预留演示视频位置"><span>演示视频预留位</span></div><div class="links"><a href="portfolio/">作品集</a><a href="https://github.com/Muurrphy/margin">开源项目</a></div>`;
}else{
  const p=P[key];
  document.title=p.name+' · Murphy';
  document.querySelector(`nav a[data-p="${key}"]`)?.setAttribute('aria-current','page');
  const link=p.link?` <a href="${p.link[0]}">${p.link[1]} ↗</a>`:'';
  main.innerHTML=`<section class="lead"><div class="eyebrow">${p.n} / ${esc(p.name)}</div><h1>${esc(p.name)}</h1><p>${esc(p.intro)}${link}</p></section>
  <div class="player"><video id="video" controls playsinline preload="metadata" poster="${p.poster}"></video></div>
  ${p.cap?`<p class="video-caption">${esc(p.cap)}</p>`:''}
  <p id="status" class="status">视频载入失败，请刷新页面重试。</p>
  <div class="meta"><span>${esc(p.meta)}</span><a href="portfolio/">在作品集里看完整介绍 ↗</a></div>
  <section class="more"><h3>其他项目</h3><div class="row">${Object.keys(P).filter(k=>k!==key).map(k=>`<a href="${P[k].href}">${P[k].placeholder?'<div class="ph reserved"><span>演示视频预留位</span></div>':`<img src="${P[k].poster}" alt="" loading="lazy">`}${P[k].n} · ${esc(P[k].name)}</a>`).join('')}</div></section>`;
  const video=document.getElementById('video'),status=document.getElementById('status');
  if(!p.hls){video.src=p.src;video.addEventListener('error',()=>status.classList.add('visible'));}
  else{
    let hls,compatibility=false;
    function loadVideo(fallback=false){
      compatibility=fallback;
      const source=fallback?'desk-compatible/index.m3u8?v=20261008-d5bae9d59f':'desk-4k-hevc/index.m3u8?v=20261008-d5bae9d59f';
      if(hls){hls.destroy();hls=null;}
      if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=source;
      else if(window.Hls&&window.Hls.isSupported()){
        hls=new Hls({enableWorker:true,maxBufferLength:18});
        hls.loadSource(source);hls.attachMedia(video);
        hls.on(Hls.Events.ERROR,(_e,data)=>{if(data.fatal){if(!compatibility)loadVideo(true);else status.classList.add('visible');}});
      }else status.classList.add('visible');
    }
    video.addEventListener('error',()=>{if(!compatibility)loadVideo(true);else status.classList.add('visible');});
    loadVideo(!video.canPlayType('video/mp4; codecs="hvc1.1.6.L153.B0"'));
  }
}
</script>
</body>
</html>
