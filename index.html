<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>桌面机器人 · 项目演示</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      *{box-sizing:border-box}body{margin:0;background:#fff;color:#151515;font-family:system-ui,sans-serif}
      main{max-width:1150px;margin:auto;padding:40px 25px}nav{display:flex;gap:24px;border-bottom:1px solid #ddd;padding-bottom:22px;font-size:14px}
      a{color:inherit;text-underline-offset:6px}h1{font-size:clamp(32px,5vw,48px);font-weight:550;margin:40px 0 12px}p{line-height:1.8;color:#555}
      video{display:block;width:100%;max-height:73vh;background:#111;margin:28px 0}.status{display:none;color:#8b1d2c}.status.visible{display:block}
      .project-section{scroll-margin-top:24px}.project-section+.project-section{border-top:1px solid #ddd;margin-top:48px;padding-top:38px}
      .project-section h2{font-size:clamp(24px,3.2vw,34px);font-weight:560;margin:0 0 8px}.project-section p{margin:0}
      footer{border-top:1px solid #ddd;padding-top:20px;color:#666;font-size:13px}
    </style>
  </head>
  <body>
    <main>
      <nav><a href="?project=desk">桌面机器人</a><a href="?project=ground">地面机器人</a><a href="?project=so101">SO-101 视觉分拣</a></nav>
      <h1 id="title">桌面机器人</h1>
      <p id="intro">实时语音交流 · 声音与表情协同 · 软硬件系统集成</p>
      <div id="media"><video id="video" controls playsinline preload="metadata" poster="desk.jpg"></video></div>
      <p id="status" class="status">视频载入失败，请刷新页面重试。</p>
      <footer id="footer">1080p 高清中文项目实拍 · 5 分 13 秒</footer>
    </main>
    <script src="hls.min.js"></script>
    <script>
      const media=document.getElementById('media');
      const status=document.getElementById('status');
      const project=new URLSearchParams(location.search).get('project')||'desk';
      if(project==='ground'){
        const video=document.getElementById('video');
        document.title='地面机器人 · 项目演示';
        document.getElementById('title').textContent='地面机器人';
        document.getElementById('intro').textContent='热成像跟随 · 双侧激光测距避障 · 无线观察台';
        video.poster='ground.jpg';video.src='ground.mp4';
        document.getElementById('footer').textContent='高清项目实拍演示 · 47 秒';
      }else if(project==='so101'){
        document.title='SO-101 机械臂实验集 · 项目演示';
        document.getElementById('title').textContent='SO-101 机械臂实验集';
        document.getElementById('intro').textContent='从预测下一状态，到用视觉选择实机分拣轨迹';
        media.innerHTML=`
          <section class="project-section" id="prediction">
            <h2>01 / 预测下一步</h2>
            <p>当前物体位置 + 六个关节指令 → 预测 2 秒后红色物体位置</p>
            <video controls playsinline preload="metadata" poster="so101-prediction.jpg" src="so101-prediction.mp4"></video>
          </section>
          <section class="project-section" id="sorting">
            <h2>02 / 视觉分拣</h2>
            <p>腕部相机判断红蓝方块位置，自动选择对应的示教轨迹并完成实机分拣</p>
            <video controls playsinline preload="metadata" poster="so101-sorting.jpg" src="so101-sorting.mp4"></video>
          </section>`;
        document.getElementById('footer').textContent='两个 SO-101 实机项目 · 预测 00:53 + 分拣 01:26';
      }else{
        const video=document.getElementById('video');
        const source='desk-hd/index.m3u8';
        if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=source;
        else if(window.Hls&&window.Hls.isSupported()){
          const hls=new Hls({enableWorker:true,maxBufferLength:30});
          hls.loadSource(source);hls.attachMedia(video);
          hls.on(Hls.Events.ERROR,(_event,data)=>{if(data.fatal)status.classList.add('visible')});
        }else status.classList.add('visible');
      }
    </script>
  </body>
</html>
